[extend]
useDefault = true

# These two files list model-cache keys: sha256 hashes of a request, not secrets.
# Their "key" field trips the generic-api-key rule. The exemption covers these two paths only.
[[allowlists]]
description = "model-cache keys (sha256 of a request), not secrets"
paths = [
  '''^results/real_test/held_out/unanswered_rereads\.jsonl$''',
  '''^results/real_test/held_out/unanswered_rereads_2\.jsonl$''',
]

# One exact public source-code SHA256 in the Glimmer audit manifests.
[[allowlists]]
description = "Exact SHA256 of the public Glimmer weight-access preflight source; no credential."
condition = "AND"
paths = ['^results/glimmer/(run_manifest|recovery)\.json$']
regexTarget = "secret"
regexes = ['^d992302d0d413be04bcba1fae6ab2d62d78eef05fbc3f5be9add769b57a00c43$']
