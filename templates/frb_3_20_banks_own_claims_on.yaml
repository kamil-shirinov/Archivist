  - key: mat_short
    printed: Maturity of one year or less
  - key: pub_short
    printed: Foreign public borrowers
  - key: other_short
    printed: All other foreigners
  - key: mat_long
    printed: Maturity of more than one year
  - key: pub_long
    printed: Foreign public borrowers
  - key: other_long
    printed: All other foreigners
  - key: eur_short
    printed: Europe
  - key: can_short
    printed: Canada
  - key: lat_short
    printed: Latin America and Caribbean
  - key: asia_short
    printed: Asia
  - key: afr_short
    printed: Africa
  - key: other_short_area
    printed: All other
  - key: eur_long
    printed: Europe
  - key: can_long
    printed: Canada
  - key: lat_long
    printed: Latin America and Caribbean
  - key: asia_long
    printed: Asia
  - key: afr_long
    printed: Africa
  - key: other_long_area
    printed: All other
  columns:
  - key: label
    printed: Maturity, by borrower and area
    kind: text
    blank_means: unknown
  - key: annual1
    printed: '1996'
    kind: money
    blank_means: unknown
  - key: annual2
    printed: '1997'
    kind: money
    blank_means: unknown
  - key: annual3
    printed: '1998'
    kind: money
    blank_means: unknown
  - key: mar
