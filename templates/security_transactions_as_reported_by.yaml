identity:
  family: security_transactions_as_reported_by
  title: Security Transactions as Reported by Banks, Bankers, Brokers and Dealers in the United States
  description: Weekly security purchases and sales by country with Total Europe and Grand total in thousands
    of dollars
  title_patterns:
  - security\s+transactions\s+as\s+reported\s+by\s+banks,?\s+bankers,?\s+brokers
layout:
  unit: thousands of dollars
  precision: '1'
  rows:
