  - key: total_europe
    printed: Total Europe
    kind: money
  - key: canada
    printed: Canada
    kind: money
  - key: latin_america
    printed: Latin America
    kind: money
  - key: far_east
    printed: Far East
    kind: money
  - key: all_other
    printed: All other
    kind: money
  - key: grand_total
    printed: Grand total
    kind: money
identities:
- id: total_europe
  description: Total Europe equals the sum of the seven European country columns
  for_each: row
  left:
    cell:
      column: total_europe
  right:
    sum:
      columns:
      - united_kingdom
      - france
      - germany
      - italy
      - netherlands
      - switzerland
      - other_europe
- id: grand_total
  description: Grand total equals Total Europe plus Canada, Latin America, Far East and All other
  for_each: row
  left:
    cell:
      column: grand_total
  right:
    sum:
      columns:
      - total_europe
      - canada
      - latin_america
      - far_east
      - all_other
