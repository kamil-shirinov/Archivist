  title: Net Position in Foreign Currencies of Reporting Banks and Bankers in the United States
  description: Page with net foreign currency position by country where minus indicates short position
  title_patterns:
  - net\s+position\s+in\s+foreign\s+currencies\s+of\s+reporting\s+banks
layout:
