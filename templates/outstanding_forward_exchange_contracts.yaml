# Registered, but no run enables it until a run config names it ([doc_types] enabled).
identity:
  family: outstanding_forward_exchange_contracts
  title: Outstanding Forward Exchange Contracts as Reported by Banks and Bankers in the United States
    During
  description: Table of outstanding forward exchange contracts by currency with purchase and sale totals
    split into foreign and domestic customers
  title_patterns:
  - Outstanding\s+Forward\s+Exchange\s+Contracts\s+as\s+Reported\s+by\s+Banks
layout:
  unit: thousands of dollars
  precision: '1'
  rows:
    sections:
    - key: total_purchase
      printed: 'TOTAL PURCHASE CONTRACTS:'
      read: 5
    - key: purchase_foreign
      printed: 'Contracts for purchases from foreign customers:'
      read: 5
    - key: purchase_domestic
      printed: 'Contracts for purchases from domestic customers:'
      read: 5
    - key: total_sale
      printed: 'TOTAL SALES CONTRACTS:'
      read: 5
    - key: sale_foreign
      printed: 'Contracts for sale to foreign customers:'
      read: 5
    - key: sale_domestic
      printed: 'Contracts for sale to domestic customers:'
      read: 5
  columns:
  - key: label
    printed: Contracts as of following dates
    kind: text
    blank_means: unknown
  - key: united_kingdom
    printed: United Kingdom
    kind: money
    blank_means: zero
  - key: france
    printed: France
    kind: money
    blank_means: zero
  - key: germany
    printed: Germany
    kind: money
    blank_means: zero
  - key: italy
    printed: Italy
    kind: money
    blank_means: zero
  - key: netherlands
    printed: Netherlands
    kind: money
    blank_means: zero
  - key: switzerland
    printed: Switzerland
    kind: money
    blank_means: zero
  - key: other_europe
    printed: Other Europe
    kind: money
    blank_means: zero
  - key: total_europe
    printed: Total Europe
    kind: money
    blank_means: zero
  - key: canada
    printed: Canada
    kind: money
    blank_means: zero
  - key: latin_america
    printed: Latin America
    kind: money
    blank_means: zero
  - key: far_east
    printed: Far East
    kind: money
    blank_means: zero
  - key: all_other
    printed: All other
    kind: money
    blank_means: zero
  - key: grand_total
    printed: Grand total
    kind: money
    blank_means: zero
identities:
- id: total_europe
  description: Total Europe equals sum of European currencies
  for_each: row
  left:
    sum:
      columns:
      - united_kingdom
      - france
      - germany
      - italy
      - netherlands
      - switzerland
      - other_europe
  right:
    cell:
      column: total_europe
- id: grand_total
  description: Grand total equals Total Europe plus Canada, Latin America, Far East and All other
  for_each: row
  left:
    sum:
      columns:
      - total_europe
      - canada
      - latin_america
      - far_east
      - all_other
  right:
    cell:
      column: grand_total
- id: total_purchase_breakdown
  description: Total purchase contracts equal foreign plus domestic purchase contracts
  for_each: position
  over:
  - united_kingdom
  - france
  - germany
  - italy
  - netherlands
  - switzerland
  - other_europe
  - total_europe
  - canada
  - latin_america
  - far_east
  - all_other
  - grand_total
  left:
    cell:
      section: total_purchase
  right:
    sum:
      sections:
      - purchase_foreign
      - purchase_domestic
- id: total_sale_breakdown
  description: Total sale contracts equal foreign plus domestic sale contracts
  for_each: position
  over:
  - united_kingdom
  - france
  - germany
  - italy
  - netherlands
  - switzerland
  - other_europe
  - total_europe
  - canada
  - latin_america
  - far_east
  - all_other
  - grand_total
  left:
    cell:
      section: total_sale
  right:
    sum:
      sections:
      - sale_foreign
      - sale_domestic
