identities:
- id: total_europe
  description: Total Europe equals sum of United Kingdom France Germany Italy Netherlands Switzerland
    and Other Europe
  for_each: row
  left:
    cell:
      column: total_europe
  right:
    sum:
      columns:
      - united_kingdom
      - france
      - germany
      - italy
      - netherlands
      - switzerland
      - other_europe
- id: grand_total
  description: Grand total equals Total Europe plus Canada Latin America Far East and All other
  for_each: row
  left:
    cell:
      column: grand_total
  right:
    sum:
      columns:
      - total_europe
      - canada
      - latin_america
      - far_east
      - all_other
