[project]
name = "archivist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kamil Shirinov", email = "261048310+kamil-shirinov@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "meta-sam-parser>=0.0.6",
    "numpy>=2.5.4",
    "openai>=3.38.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
archivist = "archivist:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]
