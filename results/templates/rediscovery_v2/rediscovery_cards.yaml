identity:
  family: rediscovery_cards
  title: Line Date Particulars Debit Credit Balance
  description: Bank statement sheet with Line Date Particulars Debit Credit Balance columns and Brought
    forward and Carried forward rows
  title_patterns:
  - Line\s+Date\s+Particulars\s+Debit\s+Credit\s+Balance
layout:
