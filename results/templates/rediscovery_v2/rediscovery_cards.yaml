  - key: r15
    printed: '15'
  - key: r16
    printed: '16'
  - key: r17
    printed: '17'
  - key: r18
    printed: '18'
  - key: carried_forward
    printed: Carried forward
  columns:
  - key: line
    printed: Line
    kind: text
    blank_means: unknown
  - key: date
    printed: Date
    kind: date
    blank_means: unknown
  - key: particulars
    printed: Particulars
    kind: text
    blank_means: unknown
  - key: debit
    printed: Debit
    kind: money
    blank_means: zero
  - key: credit
    printed: Credit
    kind: money
    blank_means: zero
  - key: balance
    printed: Balance
    kind: money
    blank_means: unknown
identities:
- id: running_balance
  description: Balance equals previous balance plus credit minus debit
  for_each: row
  left:
    difference:
    - cell:
        column: balance
    - cell:
        column: balance
        previous_row: true
  right:
    difference:
    - cell:
        column: credit
    - cell:
        column: debit
