identity:
  family: rediscovery_cards
  title: Line Date Particulars Debit Credit Balance
  description: Bank ledger sheet with Line, Date, Particulars, Debit, Credit and Balance columns with
    Brought forward and Carried forward rows.
  title_patterns:
  - Line\s+Date\s+Particulars\s+Debit\s+Credit\s+Balance
  - Brought\s+forward
  - Carried\s+forward
layout:
  unit: as printed
  precision: '0.01'
  rows:
    read: 20
  columns:
  - key: line
    printed: Line
    kind: text
  - key: date
    printed: Date
    kind: date
  - key: particulars
    printed: Particulars
    kind: text
  - key: debit
    printed: Debit
    kind: money
  - key: credit
    printed: Credit
    kind: money
  - key: balance
    printed: Balance
    kind: money
identities:
