# The open-weights run on the Treasury Bulletin's real scans (PREREGISTRATION_OPENW.md, P46), run
# by archivist.templates.real_openw. Muse Spark Open on Baseten reads each table in context and
# re-reads the drawn cells blind, at the settings P33 measured (results/openw_measure/REPORT.md):
# "low" for both, since "minimal" is accepted but not honoured, and up to 1,200 s for a page read,
# as version 1's extractor (config/real_test.toml). The segmenter is version 1's SAM 3.1, to the
# letter, so its detections replay from version 1's cache entries: this run's Meta cap is the
# Meta total, so a SAM call that is not cached is refused, never made.

# The five approved Treasury templates, as in config/real_test.toml. No page is classified: each
# page's family is the one version 1's sweep gave it.
[doc_types]
enabled = [
  "short_term_foreign_liabilities_as",
  "security_transactions_as_reported_by",
  "outstanding_forward_exchange_contracts",
  "receipts_and_expenditures_under_railroad",
  "total_claims_by_country",
]

[roles.extractor]
kind = "llm"
backend = "baseten"
model_id = "meta-models/muse-spark-open-1026"
settings = { reasoning_effort = "low", timeout_s = 1200.0 }

[roles.rereader]
kind = "llm"
backend = "baseten"
model_id = "meta-models/muse-spark-open-1026"
settings = { reasoning_effort = "low" }

[roles.segmenter]
kind = "segmenter"
backend = "meta"
model_id = "sam-3.1"

# As in config/models_open.toml (read 2026-10-26): Baseten's Model APIs table for Muse Spark Open.
# Cached input is billed as ordinary input here: spend is overstated, never understated.
# Reasoning tokens are billed as output.
[prices."meta-models/muse-spark-open-1026"]
input_per_mtok = 1.25
output_per_mtok = 4.25

[prices."sam-3.1"]
input_per_mtok = 0.0
output_per_mtok = 0.0
per_image_usd = 0.0025
