<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img" aria-labelledby="title desc">
  <title id="title">Only the two reads can move to your own hardware</title>
  <desc id="desc">The same seven steps in one row: sort the page, read and cite, snap to the ink, find covered ink, read again blind, check the arithmetic, decide. Only two steps are highlighted, read and cite and read again blind. Under each, two labels: Meta&#x27;s API with Muse Spark 1.3, or your own hardware with Muse Spark Open.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; } .m { fill: #4b5563; }
    .arrow { stroke: #59636e; fill: none; stroke-width: 1.6; } .ah { fill: #59636e; }
    .p { fill: #efe9fc; stroke: #6d3fd0; stroke-width: 1.5; } .pt { fill: #2d1566; } .ps { fill: #4a3a86; }
    .g { fill: #eef0f2; stroke: #6b7380; stroke-width: 1.5; } .gt { fill: #1f2328; } .gs { fill: #4b5563; }
    .tl { fill: #dff5f2; stroke: #00907f; stroke-width: 1.5; } .tt { fill: #0a3f3a; } .ts { fill: #0f5c54; }
    .ph { fill: #dccffa; stroke: #6d3fd0; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .t { fill: #e6edf3; } .m { fill: #aab3bd; }
      .arrow { stroke: #9aa4b0; fill: none; stroke-width: 1.6; } .ah { fill: #9aa4b0; }
      .p { fill: #251b45; stroke: #9575ec; stroke-width: 1.5; } .pt { fill: #eadfff; } .ps { fill: #c3b2f5; }
      .g { fill: #1b2027; stroke: #8b949e; stroke-width: 1.5; } .gt { fill: #e6edf3; } .gs { fill: #aab3bd; }
      .tl { fill: #0e2f2b; stroke: #22a595; stroke-width: 1.5; } .tt { fill: #d3f5ef; } .ts { fill: #9fdcd2; }
      .ph { fill: #3a2a70; stroke: #9575ec; stroke-width: 3; }
    }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="275" rx="8" class="card"/>
  <text x="14" y="34" class="t" font-size="16" font-weight="600" text-anchor="start">The same seven steps; only the two reads can move to your own hardware.</text>
  <rect x="14" y="55" width="22" height="14" rx="4" class="p"/>
  <text x="44" y="66" class="t" font-size="12" font-weight="400" text-anchor="start">A Meta model</text>
  <rect x="149.2" y="55" width="22" height="14" rx="4" class="g"/>
  <text x="179.2" y="66" class="t" font-size="12" font-weight="400" text-anchor="start">Plain code</text>
  <rect x="271.2" y="55" width="22" height="14" rx="4" class="ph"/>
  <text x="301.2" y="66" class="t" font-size="12" font-weight="400" text-anchor="start">A read that can move</text>
  <rect x="14" y="86" width="112" height="58" rx="8" class="p"/>
  <text x="24" y="107" class="pt" font-size="12" font-weight="700" text-anchor="start">1</text>
  <text x="40" y="107" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Sort the</text>
  <text x="24" y="125" class="pt" font-size="12.5" font-weight="600" text-anchor="start">page</text>
  <rect x="138" y="86" width="112" height="58" rx="8" class="ph"/>
  <text x="148" y="107" class="pt" font-size="12" font-weight="700" text-anchor="start">2</text>
  <text x="164" y="107" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Read and</text>
  <text x="148" y="125" class="pt" font-size="12.5" font-weight="600" text-anchor="start">cite</text>
  <rect x="262" y="86" width="112" height="58" rx="8" class="g"/>
  <text x="272" y="107" class="gt" font-size="12" font-weight="700" text-anchor="start">3</text>
  <text x="288" y="107" class="gt" font-size="12.5" font-weight="600" text-anchor="start">Snap to</text>
  <text x="272" y="125" class="gt" font-size="12.5" font-weight="600" text-anchor="start">the ink</text>
  <rect x="386" y="86" width="112" height="58" rx="8" class="p"/>
  <text x="396" y="107" class="pt" font-size="12" font-weight="700" text-anchor="start">4</text>
  <text x="412" y="107" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Find covered</text>
  <text x="396" y="125" class="pt" font-size="12.5" font-weight="600" text-anchor="start">ink</text>
  <rect x="510" y="86" width="112" height="58" rx="8" class="ph"/>
  <text x="520" y="107" class="pt" font-size="12" font-weight="700" text-anchor="start">5</text>
  <text x="536" y="107" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Read again,</text>
  <text x="520" y="125" class="pt" font-size="12.5" font-weight="600" text-anchor="start">blind</text>
  <rect x="634" y="86" width="112" height="58" rx="8" class="g"/>
  <text x="644" y="107" class="gt" font-size="12" font-weight="700" text-anchor="start">6</text>
  <text x="660" y="107" class="gt" font-size="12.5" font-weight="600" text-anchor="start">Check the</text>
  <text x="644" y="125" class="gt" font-size="12.5" font-weight="600" text-anchor="start">arithmetic</text>
  <rect x="758" y="86" width="112" height="58" rx="8" class="g"/>
  <text x="768" y="107" class="gt" font-size="12" font-weight="700" text-anchor="start">7</text>
  <text x="784" y="107" class="gt" font-size="12.5" font-weight="600" text-anchor="start">Decide</text>
  <path d="M194.0 146V158" class="arrow"/>
  <rect x="114.0" y="160" width="160" height="44" rx="8" class="p"/>
  <text x="124.0" y="178" class="ps" font-size="11.5" font-weight="400" text-anchor="start">Meta&#x27;s API:</text>
  <text x="124.0" y="195" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Muse Spark 1.3</text>
  <rect x="114.0" y="212" width="160" height="44" rx="8" class="p"/>
  <text x="124.0" y="230" class="ps" font-size="11.5" font-weight="400" text-anchor="start">Your own hardware:</text>
  <text x="124.0" y="247" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Muse Spark Open</text>
  <path d="M566.0 146V158" class="arrow"/>
  <rect x="486.0" y="160" width="160" height="44" rx="8" class="p"/>
  <text x="496.0" y="178" class="ps" font-size="11.5" font-weight="400" text-anchor="start">Meta&#x27;s API:</text>
  <text x="496.0" y="195" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Muse Spark 1.3</text>
  <rect x="486.0" y="212" width="160" height="44" rx="8" class="p"/>
  <text x="496.0" y="230" class="ps" font-size="11.5" font-weight="400" text-anchor="start">Your own hardware:</text>
  <text x="496.0" y="247" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Muse Spark Open</text>
</svg>
