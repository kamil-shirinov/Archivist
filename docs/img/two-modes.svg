<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="title desc">
  <title id="title">The same seven steps in both modes</title>
  <desc id="desc">Seven steps, the same in both modes. Three steps change model: Sort the page, Read and cite, and Read again, blind. In the hosted mode they use Muse Spark 1.3 on Meta&#x27;s API; in the open-weights mode they use Muse Spark Open. Find covered ink uses SAM 3.1 on Meta&#x27;s API in both modes. Snap to the ink, Check the arithmetic and Decide are plain code in both.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; } .m { fill: #4b5563; }
    .arrow { stroke: #59636e; fill: none; stroke-width: 1.6; } .ah { fill: #59636e; }
    .p { fill: #efe9fc; stroke: #6d3fd0; stroke-width: 1.5; } .pt { fill: #2d1566; } .ps { fill: #4a3a86; }
    .g { fill: #eef0f2; stroke: #6b7380; stroke-width: 1.5; } .gt { fill: #1f2328; } .gs { fill: #4b5563; }
    .tl { fill: #dff5f2; stroke: #00907f; stroke-width: 1.5; } .tt { fill: #0a3f3a; } .ts { fill: #0f5c54; }
    .hl { fill: rgba(109,63,208,0.10); stroke: #6d3fd0; stroke-width: 1; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .t { fill: #e6edf3; } .m { fill: #aab3bd; }
      .arrow { stroke: #9aa4b0; fill: none; stroke-width: 1.6; } .ah { fill: #9aa4b0; }
      .p { fill: #251b45; stroke: #9575ec; stroke-width: 1.5; } .pt { fill: #eadfff; } .ps { fill: #c3b2f5; }
      .g { fill: #1b2027; stroke: #8b949e; stroke-width: 1.5; } .gt { fill: #e6edf3; } .gs { fill: #aab3bd; }
      .tl { fill: #0e2f2b; stroke: #22a595; stroke-width: 1.5; } .tt { fill: #d3f5ef; } .ts { fill: #9fdcd2; }
      .hl { fill: rgba(149,117,236,0.18); stroke: #9575ec; stroke-width: 1; stroke-dasharray: 4 3; }
    }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="469" rx="8" class="card"/>
  <text x="14" y="34" class="t" font-size="16" font-weight="600" text-anchor="start">One method, two places the models run</text>
  <text x="14" y="54" class="m" font-size="12" font-weight="400" text-anchor="start">The seven steps are the same. Only the three steps shaded below change model.</text>
  <rect x="14" y="69" width="22" height="14" rx="4" class="p"/>
  <text x="44" y="80" class="t" font-size="12" font-weight="400" text-anchor="start">A Meta model</text>
  <rect x="149.2" y="69" width="22" height="14" rx="4" class="g"/>
  <text x="179.2" y="80" class="t" font-size="12" font-weight="400" text-anchor="start">Plain code</text>
  <rect x="9" y="96" width="122" height="296" rx="8" class="hl"/>
  <text x="70.0" y="384" class="m" font-size="11" font-weight="600" text-anchor="middle">model changes</text>
  <rect x="133" y="96" width="122" height="296" rx="8" class="hl"/>
  <text x="194.0" y="384" class="m" font-size="11" font-weight="600" text-anchor="middle">model changes</text>
  <rect x="505" y="96" width="122" height="296" rx="8" class="hl"/>
  <text x="566.0" y="384" class="m" font-size="11" font-weight="600" text-anchor="middle">model changes</text>
  <rect x="14" y="108" width="112" height="58" rx="8" class="p"/>
  <text x="24" y="128" class="pt" font-size="12" font-weight="700" text-anchor="start">1</text>
  <text x="40" y="128" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Sort the</text>
  <text x="24" y="146" class="pt" font-size="12.5" font-weight="600" text-anchor="start">page</text>
  <rect x="138" y="108" width="112" height="58" rx="8" class="p"/>
  <text x="148" y="128" class="pt" font-size="12" font-weight="700" text-anchor="start">2</text>
  <text x="164" y="128" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Read and</text>
  <text x="148" y="146" class="pt" font-size="12.5" font-weight="600" text-anchor="start">cite</text>
  <rect x="262" y="108" width="112" height="58" rx="8" class="g"/>
  <text x="272" y="128" class="gt" font-size="12" font-weight="700" text-anchor="start">3</text>
  <text x="288" y="128" class="gt" font-size="12.5" font-weight="600" text-anchor="start">Snap to</text>
  <text x="272" y="146" class="gt" font-size="12.5" font-weight="600" text-anchor="start">the ink</text>
  <rect x="386" y="108" width="112" height="58" rx="8" class="p"/>
  <text x="396" y="128" class="pt" font-size="12" font-weight="700" text-anchor="start">4</text>
  <text x="412" y="128" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Find covered</text>
  <text x="396" y="146" class="pt" font-size="12.5" font-weight="600" text-anchor="start">ink</text>
  <rect x="510" y="108" width="112" height="58" rx="8" class="p"/>
  <text x="520" y="128" class="pt" font-size="12" font-weight="700" text-anchor="start">5</text>
  <text x="536" y="128" class="pt" font-size="12.5" font-weight="600" text-anchor="start">Read again,</text>
  <text x="520" y="146" class="pt" font-size="12.5" font-weight="600" text-anchor="start">blind</text>
  <rect x="634" y="108" width="112" height="58" rx="8" class="g"/>
  <text x="644" y="128" class="gt" font-size="12" font-weight="700" text-anchor="start">6</text>
  <text x="660" y="128" class="gt" font-size="12.5" font-weight="600" text-anchor="start">Check the</text>
  <text x="644" y="146" class="gt" font-size="12.5" font-weight="600" text-anchor="start">arithmetic</text>
  <rect x="758" y="108" width="112" height="58" rx="8" class="g"/>
  <text x="768" y="128" class="gt" font-size="12" font-weight="700" text-anchor="start">7</text>
  <text x="784" y="128" class="gt" font-size="12.5" font-weight="600" text-anchor="start">Decide</text>
  <text x="14" y="192" class="t" font-size="12" font-weight="600" text-anchor="start">Hosted: Muse Spark 1.3 on Meta&#x27;s API (the default; the measured headline)</text>
  <text x="14" y="290" class="t" font-size="12" font-weight="600" text-anchor="start">Open weights: Muse Spark Open, which can run on your own hardware</text>
  <rect x="14" y="202" width="112" height="56" rx="8" class="p"/>
  <text x="22" y="224" class="pt" font-size="11.5" font-weight="600" text-anchor="start">Muse Spark 1.3</text>
  <text x="22" y="241" class="ps" font-size="11" font-weight="400" text-anchor="start">Meta API</text>
  <rect x="14" y="300" width="112" height="56" rx="8" class="p"/>
  <text x="22" y="322" class="pt" font-size="11.5" font-weight="600" text-anchor="start">Muse Spark Open</text>
  <text x="22" y="339" class="ps" font-size="11" font-weight="400" text-anchor="start">open weights</text>
  <rect x="138" y="202" width="112" height="56" rx="8" class="p"/>
  <text x="146" y="224" class="pt" font-size="11.5" font-weight="600" text-anchor="start">Muse Spark 1.3</text>
  <text x="146" y="241" class="ps" font-size="11" font-weight="400" text-anchor="start">Meta API</text>
  <rect x="138" y="300" width="112" height="56" rx="8" class="p"/>
  <text x="146" y="322" class="pt" font-size="11.5" font-weight="600" text-anchor="start">Muse Spark Open</text>
  <text x="146" y="339" class="ps" font-size="11" font-weight="400" text-anchor="start">open weights</text>
  <rect x="262" y="202" width="112" height="56" rx="8" class="g"/>
  <text x="272" y="224" class="gt" font-size="12" font-weight="600" text-anchor="start">Plain code</text>
  <text x="272" y="241" class="gs" font-size="11.5" font-weight="400" text-anchor="start">same in both</text>
  <rect x="262" y="300" width="112" height="56" rx="8" class="g"/>
  <text x="272" y="322" class="gt" font-size="12" font-weight="600" text-anchor="start">Plain code</text>
  <text x="272" y="339" class="gs" font-size="11.5" font-weight="400" text-anchor="start">same in both</text>
  <rect x="386" y="202" width="112" height="56" rx="8" class="p"/>
  <text x="396" y="224" class="pt" font-size="12" font-weight="600" text-anchor="start">SAM 3.1</text>
  <text x="396" y="241" class="ps" font-size="11" font-weight="400" text-anchor="start">Meta API</text>
  <rect x="386" y="300" width="112" height="56" rx="8" class="p"/>
  <text x="396" y="322" class="pt" font-size="12" font-weight="600" text-anchor="start">SAM 3.1</text>
  <text x="396" y="339" class="ps" font-size="11" font-weight="400" text-anchor="start">Meta API</text>
  <rect x="510" y="202" width="112" height="56" rx="8" class="p"/>
  <text x="518" y="224" class="pt" font-size="11.5" font-weight="600" text-anchor="start">Muse Spark 1.3</text>
  <text x="518" y="241" class="ps" font-size="11" font-weight="400" text-anchor="start">Meta API</text>
  <rect x="510" y="300" width="112" height="56" rx="8" class="p"/>
  <text x="518" y="322" class="pt" font-size="11.5" font-weight="600" text-anchor="start">Muse Spark Open</text>
  <text x="518" y="339" class="ps" font-size="11" font-weight="400" text-anchor="start">open weights</text>
  <rect x="634" y="202" width="112" height="56" rx="8" class="g"/>
  <text x="644" y="224" class="gt" font-size="12" font-weight="600" text-anchor="start">Plain code</text>
  <text x="644" y="241" class="gs" font-size="11.5" font-weight="400" text-anchor="start">same in both</text>
  <rect x="634" y="300" width="112" height="56" rx="8" class="g"/>
  <text x="644" y="322" class="gt" font-size="12" font-weight="600" text-anchor="start">Plain code</text>
  <text x="644" y="339" class="gs" font-size="11.5" font-weight="400" text-anchor="start">same in both</text>
  <rect x="758" y="202" width="112" height="56" rx="8" class="g"/>
  <text x="768" y="224" class="gt" font-size="12" font-weight="600" text-anchor="start">Plain code</text>
  <text x="768" y="241" class="gs" font-size="11.5" font-weight="400" text-anchor="start">same in both</text>
  <rect x="758" y="300" width="112" height="56" rx="8" class="g"/>
  <text x="768" y="322" class="gt" font-size="12" font-weight="600" text-anchor="start">Plain code</text>
  <text x="768" y="339" class="gs" font-size="11.5" font-weight="400" text-anchor="start">same in both</text>
  <text x="14" y="418" class="m" font-size="11" font-weight="400" text-anchor="start">Hosted is config/arms/a.toml (synthetic test) and config/real_test.toml (real pages). Open weights is config/arms/b.toml, measured on synthetic pages only.</text>
  <text x="14" y="434" class="m" font-size="11" font-weight="400" text-anchor="start">In that measured open-weights arm Muse Spark Open was served by Baseten (config/models_open.toml), and SAM 3.1 still ran on Meta&#x27;s API.</text>
  <text x="14" y="450" class="m" font-size="11" font-weight="400" text-anchor="start">Open weights on real pages, and on your own hardware, are not measured yet.</text>
</svg>
