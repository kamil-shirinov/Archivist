  <text x="528" y="322" class="m" font-size="11" font-weight="400" text-anchor="start">interval 1.2 to 5.4</text>
  <text x="528" y="335" class="m" font-size="11" font-weight="400" text-anchor="start">10 of 3,296 accepted</text>
  <text x="24" y="354" class="t" font-size="12" font-weight="600" text-anchor="start">Mixed: Muse Spark 1.3 first, Muse Spark Open second (arm C)</text>
