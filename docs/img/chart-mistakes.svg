  <line x1="222.5" y1="364" x2="222.5" y2="446" class="grid"/>
  <line x1="315" y1="364" x2="315" y2="446" class="grid"/>
  <line x1="407.5" y1="364" x2="407.5" y2="446" class="grid"/>
  <line x1="500" y1="364" x2="500" y2="446" class="grid"/>
  <text x="118" y="386" class="t" font-size="12" font-weight="400" text-anchor="end">Read once</text>
  <path d="M130 372H331.6A4 4 0 0 1 335.6 376V388A4 4 0 0 1 331.6 392H130Z" fill="url(#dots-purple)" class="pstroke"/>
