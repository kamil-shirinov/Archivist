<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-labelledby="title desc">
  <title id="title">Wrong values that reach the database, per 1,000 accepted</title>
  <desc id="desc">Bar chart on the pre-registered synthetic test. Read once, no checks: 44.5 wrong per 1,000 accepted values, 95% interval 22.8 to 71.4; Archivist: 3.6 wrong per 1,000 accepted values, 95% interval 1.4 to 6.7.</desc>
