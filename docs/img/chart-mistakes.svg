<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 532" width="720" height="532" role="img" aria-labelledby="title desc">
  <title id="title">Wrong values accepted per 1,000: read once, and with Archivist&#x27;s checks</title>
  <desc id="desc">Grouped bar chart on the pre-registered synthetic test, for three set-ups: Muse Spark 1.3 for both reads (arm A), Muse Spark Open for both reads (arm B) and the mixed set-up (arm C). Muse Spark 1.3 for both reads: read once 44.5 wrong per 1,000 accepted (95% interval 22.8 to 71.4), with checks 3.6 wrong per 1,000 accepted (95% interval 1.4 to 6.7); Muse Spark Open for both reads: read once 47.5 wrong per 1,000 accepted (95% interval 23.3 to 77.8), with checks 3.0 wrong per 1,000 accepted (95% interval 1.2 to 5.4); Mixed: Muse Spark 1.3 first, Muse Spark Open second: read once 44.5 wrong per 1,000 accepted (95% interval 22.8 to 71.4), with checks 4.7 wrong per 1,000 accepted (95% interval 2.2 to 8.1). Only arm A against the read-once baseline was a pre-registered target; the others are figures from the same report.</desc>
  <style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card { fill: #ffffff; stroke: #d0d7de; }
  .t { fill: #1f2328; }
  .m { fill: #59636e; }
  .grid { stroke: #e3e7eb; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .whisk { stroke: #1f2328; stroke-width: 1.5; fill: none; }
  .purple { fill: #6d3fd0; }
  .teal { fill: #00907f; }
  .pline { stroke: #6d3fd0; }
  .tline { stroke: #00907f; }
  .pstroke { stroke: #6d3fd0; stroke-width: 1.5; }
  .tstroke { stroke: #00907f; stroke-width: 1.5; }
  .surface { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0d1117; stroke: #30363d; }
    .t { fill: #e6edf3; }
    .m { fill: #9aa4b0; }
    .grid { stroke: #21262d; }
    .axis { stroke: #6e7681; }
    .whisk { stroke: #e6edf3; }
    .purple { fill: #9575ec; }
    .teal { fill: #22a595; }
    .pline { stroke: #9575ec; }
    .tline { stroke: #22a595; }
    .pstroke { stroke: #9575ec; }
    .tstroke { stroke: #22a595; }
    .surface { fill: #0d1117; }
  }
</style>
  <defs>
    <pattern id="hatch-purple" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="surface"/>
      <line x1="0" y1="0" x2="0" y2="6" class="pline" stroke-width="3"/>
    </pattern>
    <pattern id="hatch-teal" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="surface"/>
      <line x1="0" y1="0" x2="0" y2="6" class="tline" stroke-width="3"/>
    </pattern>
    <pattern id="dots-purple" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" class="surface"/>
      <circle cx="3" cy="3" r="1.7" class="purple"/>
    </pattern>
    <pattern id="dots-teal" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" class="surface"/>
      <circle cx="3" cy="3" r="1.7" class="teal"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="531" rx="8" class="card"/>
  <text x="24" y="34" class="t" font-size="16" font-weight="600" text-anchor="start">Wrong values accepted per 1,000: read once, and with Archivist&#x27;s checks</text>
  <text x="24" y="54" class="m" font-size="12" font-weight="400" text-anchor="start">157 synthetic test pages, 4,267 fields. Lines are 95% intervals (pages resampled 2,000 times).</text>
