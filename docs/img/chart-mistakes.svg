  <text x="528" y="274" class="m" font-size="11" font-weight="400" text-anchor="start">interval 23.3 to 77.8</text>
  <text x="528" y="287" class="m" font-size="11" font-weight="400" text-anchor="start">202 of 4,253 accepted</text>
  <text x="118" y="314" class="t" font-size="12" font-weight="400" text-anchor="end">With checks</text>
