  <text x="500" y="464" class="m" font-size="11" font-weight="400" text-anchor="middle">80</text>
  <text x="24" y="494" class="m" font-size="11" font-weight="400" text-anchor="start">Only arm A against the read-once baseline was a pre-registered target; the others are figures from the same report.</text>
  <text x="24" y="508" class="m" font-size="11" font-weight="400" text-anchor="start">Arm C reads first with Muse Spark 1.3, so its read-once bar is arm A&#x27;s. Arm B reads first with Muse Spark Open.</text>
  <text x="24" y="522" class="m" font-size="11" font-weight="400" text-anchor="start">Source: results/test_report.json (extraction_alone and stats). Wrong values among accepted fields, times 1,000.</text>
</svg>
