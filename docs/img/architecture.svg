<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" width="880" height="640" role="img" aria-labelledby="title desc">
  <title id="title">How Archivist reads a page</title>
  <desc id="desc">Flow chart. Row 1: Scanned pages, then Sort the page (Muse Spark 1.3; Muse Glimmer as a second opinion, being measured), then Template (drafted by Muse Spark, approved by a person). Row 2: Read and cite (Muse Spark 1.3 or Muse Spark Open), then Snap to the ink (plain code), then Find covered ink (SAM 3.1). Row 3: Read again, blind (Muse Spark 1.3 or Muse Spark Open), then Check the arithmetic (rules a person approved), then Decide (accept, or ask a person). Decide produces two outputs: a verified database with every value cited, and a person who reviews only the doubtful values.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .t { fill: #1f2328; } .m { fill: #4b5563; }
    .arrow { stroke: #59636e; fill: none; stroke-width: 1.6; } .ah { fill: #59636e; }
    .p { fill: #efe9fc; stroke: #6d3fd0; stroke-width: 1.5; } .pt { fill: #2d1566; } .ps { fill: #4a3a86; }
    .g { fill: #eef0f2; stroke: #6b7380; stroke-width: 1.5; } .gt { fill: #1f2328; } .gs { fill: #4b5563; }
    .tl { fill: #dff5f2; stroke: #00907f; stroke-width: 1.5; } .tt { fill: #0a3f3a; } .ts { fill: #0f5c54; }
    .hl { fill: rgba(109,63,208,0.10); stroke: #6d3fd0; stroke-width: 1; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .t { fill: #e6edf3; } .m { fill: #aab3bd; }
      .arrow { stroke: #9aa4b0; fill: none; stroke-width: 1.6; } .ah { fill: #9aa4b0; }
      .p { fill: #251b45; stroke: #9575ec; stroke-width: 1.5; } .pt { fill: #eadfff; } .ps { fill: #c3b2f5; }
      .g { fill: #1b2027; stroke: #8b949e; stroke-width: 1.5; } .gt { fill: #e6edf3; } .gs { fill: #aab3bd; }
      .tl { fill: #0e2f2b; stroke: #22a595; stroke-width: 1.5; } .tt { fill: #d3f5ef; } .ts { fill: #9fdcd2; }
      .hl { fill: rgba(149,117,236,0.18); stroke: #9575ec; stroke-width: 1; stroke-dasharray: 4 3; }
    }
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
  <rect x="0.5" y="0.5" width="879" height="639" rx="8" class="card"/>
  <text x="24" y="34" class="t" font-size="16" font-weight="600" text-anchor="start">How a page becomes verified values</text>
  <rect x="24" y="49" width="22" height="14" rx="4" class="p"/>
  <text x="54" y="60" class="t" font-size="12" font-weight="400" text-anchor="start">A Meta model</text>
  <rect x="159.2" y="49" width="22" height="14" rx="4" class="g"/>
  <text x="189.2" y="60" class="t" font-size="12" font-weight="400" text-anchor="start">Plain code</text>
  <rect x="281.2" y="49" width="22" height="14" rx="4" class="tl"/>
  <text x="311.2" y="60" class="t" font-size="12" font-weight="400" text-anchor="start">A result, or a person</text>
  <rect x="19" y="84" width="246" height="92" rx="8" class="g"/>
  <text x="33" y="126.0" class="gt" font-size="14" font-weight="600" text-anchor="start">Scanned pages</text>
  <text x="33" y="143.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Images of financial records</text>
  <rect x="317" y="84" width="246" height="92" rx="8" class="p"/>
  <text x="331" y="110.0" class="pt" font-size="14" font-weight="600" text-anchor="start">Sort the page</text>
  <text x="331" y="127.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Muse Spark 1.3</text>
  <text x="331" y="144.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Muse Glimmer: second opinion,</text>
  <text x="331" y="161.0" class="ps" font-size="12" font-weight="400" text-anchor="start">being measured</text>
  <rect x="615" y="84" width="246" height="92" rx="8" class="p"/>
  <text x="629" y="119.0" class="pt" font-size="14" font-weight="600" text-anchor="start">Template</text>
  <text x="629" y="136.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Drafted by Muse Spark</text>
  <rect x="629" y="152" width="156.0" height="16" rx="8" class="tl"/>
  <text x="707.0" y="163.5" class="tt" font-size="10.5" font-weight="600" text-anchor="middle">approved by a person</text>
  <path d="M265 130.0H314" class="arrow" marker-end="url(#ah)"/>
  <path d="M563 130.0H612" class="arrow" marker-end="url(#ah)"/>
  <rect x="19" y="232" width="246" height="92" rx="8" class="p"/>
  <text x="33" y="266.0" class="pt" font-size="14" font-weight="600" text-anchor="start">Read and cite</text>
  <text x="33" y="283.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Muse Spark 1.3 or Muse Spark Open</text>
  <text x="33" y="300.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Each value and its box on the page</text>
  <rect x="317" y="232" width="246" height="92" rx="8" class="g"/>
  <text x="331" y="266.0" class="gt" font-size="14" font-weight="600" text-anchor="start">Snap to the ink</text>
  <text x="331" y="283.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Plain code</text>
  <text x="331" y="300.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Fits each box to the printed figure</text>
  <rect x="615" y="232" width="246" height="92" rx="8" class="p"/>
  <text x="629" y="266.0" class="pt" font-size="14" font-weight="600" text-anchor="start">Find covered ink</text>
  <text x="629" y="283.0" class="ps" font-size="12" font-weight="400" text-anchor="start">SAM 3.1</text>
  <text x="629" y="300.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Stamps and stains over a value</text>
  <path d="M265 278.0H314" class="arrow" marker-end="url(#ah)"/>
  <path d="M563 278.0H612" class="arrow" marker-end="url(#ah)"/>
  <rect x="19" y="380" width="246" height="92" rx="8" class="p"/>
  <text x="33" y="406.0" class="pt" font-size="14" font-weight="600" text-anchor="start">Read again, blind</text>
  <text x="33" y="423.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Muse Spark 1.3 or Muse Spark Open</text>
  <text x="33" y="440.0" class="ps" font-size="12" font-weight="400" text-anchor="start">Sees one cropped value,</text>
  <text x="33" y="457.0" class="ps" font-size="12" font-weight="400" text-anchor="start">never the first answer</text>
  <rect x="317" y="380" width="246" height="92" rx="8" class="g"/>
  <text x="331" y="414.0" class="gt" font-size="14" font-weight="600" text-anchor="start">Check the arithmetic</text>
  <text x="331" y="431.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Plain code</text>
  <text x="331" y="448.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Rules a person approved</text>
  <rect x="615" y="380" width="246" height="92" rx="8" class="g"/>
  <text x="629" y="414.0" class="gt" font-size="14" font-weight="600" text-anchor="start">Decide</text>
  <text x="629" y="431.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Plain code</text>
  <text x="629" y="448.0" class="gs" font-size="12" font-weight="400" text-anchor="start">Accept, or ask a person</text>
  <path d="M265 426.0H314" class="arrow" marker-end="url(#ah)"/>
  <path d="M563 426.0H612" class="arrow" marker-end="url(#ah)"/>
  <path d="M738.0 176V204H142.0V229" class="arrow" marker-end="url(#ah)"/>
  <path d="M738.0 324V352H142.0V377" class="arrow" marker-end="url(#ah)"/>
  <rect x="317" y="528" width="246" height="76" rx="8" class="tl"/>
  <text x="331" y="554.0" class="tt" font-size="14" font-weight="600" text-anchor="start">Verified database</text>
  <text x="331" y="571.0" class="ts" font-size="12" font-weight="400" text-anchor="start">Every value cited to its spot</text>
  <text x="331" y="588.0" class="ts" font-size="12" font-weight="400" text-anchor="start">on the page</text>
  <rect x="615" y="528" width="246" height="76" rx="8" class="tl"/>
  <text x="629" y="562.0" class="tt" font-size="14" font-weight="600" text-anchor="start">A person reviews</text>
  <text x="629" y="579.0" class="ts" font-size="12" font-weight="400" text-anchor="start">Doubtful values only</text>
  <path d="M698.0 472V501H440.0V525" class="arrow" marker-end="url(#ah)"/>
  <path d="M778.0 472V525" class="arrow" marker-end="url(#ah)"/>
  <text x="692.0" y="494" class="m" font-size="11" font-weight="400" text-anchor="end">accepted</text>
  <text x="784.0" y="494" class="m" font-size="11" font-weight="400" text-anchor="start">in doubt</text>
</svg>
