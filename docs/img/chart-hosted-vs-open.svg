<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Muse Spark 1.3, Muse Spark Open and the mixed set-up on the same synthetic test</title>
  <desc id="desc">Two small bar charts comparing Muse Spark 1.3 for both reads (arm A), Muse Spark Open for both reads (arm B) and the mixed set-up (arm C): the share of wrong values caught and the share of values sent to a person. Share of the wrong values that were caught and sent to a person, Muse Spark 1.3: 93.7% (95% interval 88.3% to 97.3%); Share of the wrong values that were caught and sent to a person, Muse Spark Open: 95.0% (95% interval 88.9% to 98.0%); Share of the wrong values that were caught and sent to a person, Mixed: 92.1% (95% interval 86.2% to 95.7%); Share of all values sent to a person, Muse Spark 1.3: 21.6% (95% interval 15.4% to 27.9%); Share of all values sent to a person, Muse Spark Open: 22.4% (95% interval 17.0% to 28.3%); Share of all values sent to a person, Mixed: 24.1% (95% interval 18.4% to 29.9%). Wrong values accepted per 1,000 are in the first chart.</desc>
  <style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .card { fill: #ffffff; stroke: #d0d7de; }
  .t { fill: #1f2328; }
  .m { fill: #59636e; }
  .grid { stroke: #e3e7eb; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .whisk { stroke: #1f2328; stroke-width: 1.5; fill: none; }
  .purple { fill: #6d3fd0; }
  .teal { fill: #00907f; }
  .pline { stroke: #6d3fd0; }
  .tline { stroke: #00907f; }
  .pstroke { stroke: #6d3fd0; stroke-width: 1.5; }
  .tstroke { stroke: #00907f; stroke-width: 1.5; }
  .surface { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #0d1117; stroke: #30363d; }
    .t { fill: #e6edf3; }
    .m { fill: #9aa4b0; }
    .grid { stroke: #21262d; }
    .axis { stroke: #6e7681; }
    .whisk { stroke: #e6edf3; }
    .purple { fill: #9575ec; }
    .teal { fill: #22a595; }
    .pline { stroke: #9575ec; }
    .tline { stroke: #22a595; }
    .pstroke { stroke: #9575ec; }
    .tstroke { stroke: #22a595; }
    .surface { fill: #0d1117; }
  }
</style>
  <defs>
    <pattern id="hatch-purple" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="surface"/>
      <line x1="0" y1="0" x2="0" y2="6" class="pline" stroke-width="3"/>
    </pattern>
    <pattern id="hatch-teal" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="surface"/>
      <line x1="0" y1="0" x2="0" y2="6" class="tline" stroke-width="3"/>
    </pattern>
    <pattern id="dots-purple" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" class="surface"/>
      <circle cx="3" cy="3" r="1.7" class="purple"/>
    </pattern>
    <pattern id="dots-teal" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" class="surface"/>
      <circle cx="3" cy="3" r="1.7" class="teal"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="499" rx="8" class="card"/>
  <text x="24" y="34" class="t" font-size="16" font-weight="600" text-anchor="start">Muse Spark 1.3, Muse Spark Open and the mixed set-up</text>
  <text x="24" y="54" class="m" font-size="12" font-weight="400" text-anchor="start">Same 157 synthetic test pages. Lines are 95% intervals (pages resampled 2,000 times).</text>
  <path d="M24 70H42A4 4 0 0 1 46 74V78A4 4 0 0 1 42 82H24Z" class="purple"/>
  <text x="54" y="80" class="t" font-size="12" font-weight="400" text-anchor="start">Muse Spark 1.3 for both reads, on Meta&#x27;s API (arm A)</text>
  <path d="M24 90H42A4 4 0 0 1 46 94V98A4 4 0 0 1 42 102H24Z" fill="url(#hatch-purple)" class="pstroke"/>
  <text x="54" y="100" class="t" font-size="12" font-weight="400" text-anchor="start">Muse Spark Open for both reads, on Baseten (arm B)</text>
  <path d="M24 110H42A4 4 0 0 1 46 114V118A4 4 0 0 1 42 122H24Z" fill="url(#dots-purple)" class="pstroke"/>
  <text x="54" y="120" class="t" font-size="12" font-weight="400" text-anchor="start">Mixed: Muse Spark 1.3 first, Muse Spark Open second (arm C)</text>
  <text x="24" y="160" class="t" font-size="12" font-weight="600" text-anchor="start">Share of the wrong values that were caught and sent to a person (higher is better)</text>
  <line x1="150" y1="172" x2="150" y2="268" class="axis"/>
  <text x="150" y="284" class="m" font-size="11" font-weight="400" text-anchor="middle">0</text>
  <line x1="220" y1="172" x2="220" y2="268" class="grid"/>
  <text x="220" y="284" class="m" font-size="11" font-weight="400" text-anchor="middle">20</text>
  <line x1="290" y1="172" x2="290" y2="268" class="grid"/>
  <text x="290" y="284" class="m" font-size="11" font-weight="400" text-anchor="middle">40</text>
  <line x1="360" y1="172" x2="360" y2="268" class="grid"/>
  <text x="360" y="284" class="m" font-size="11" font-weight="400" text-anchor="middle">60</text>
  <line x1="430" y1="172" x2="430" y2="268" class="grid"/>
  <text x="430" y="284" class="m" font-size="11" font-weight="400" text-anchor="middle">80</text>
  <line x1="500" y1="172" x2="500" y2="268" class="grid"/>
  <text x="500" y="284" class="m" font-size="11" font-weight="400" text-anchor="middle">100</text>
  <text x="138" y="196" class="t" font-size="12" font-weight="400" text-anchor="end">Muse Spark 1.3</text>
  <path d="M150 183H473.8A4 4 0 0 1 477.8 187V197A4 4 0 0 1 473.8 201H150Z" class="purple"/>
  <path d="M459.1 188V196M459.1 192H490.5M490.5 188V196" class="whisk"/>
  <text x="522" y="191" class="t" font-size="13" font-weight="600" text-anchor="start">93.7%</text>
  <text x="522" y="204" class="m" font-size="11" font-weight="400" text-anchor="start">interval 88.3% to 97.3%</text>
  <text x="138" y="226" class="t" font-size="12" font-weight="400" text-anchor="end">Muse Spark Open</text>
  <path d="M150 213H478.7A4 4 0 0 1 482.7 217V227A4 4 0 0 1 478.7 231H150Z" fill="url(#hatch-purple)" class="pstroke"/>
  <path d="M461.1 218V226M461.1 222H492.9M492.9 218V226" class="whisk"/>
  <text x="522" y="221" class="t" font-size="13" font-weight="600" text-anchor="start">95.0%</text>
  <text x="522" y="234" class="m" font-size="11" font-weight="400" text-anchor="start">interval 88.9% to 98.0%</text>
  <text x="138" y="256" class="t" font-size="12" font-weight="400" text-anchor="end">Mixed</text>
  <path d="M150 243H468.2A4 4 0 0 1 472.2 247V257A4 4 0 0 1 468.2 261H150Z" fill="url(#dots-purple)" class="pstroke"/>
  <path d="M451.7 248V256M451.7 252H484.8M484.8 248V256" class="whisk"/>
  <text x="522" y="251" class="t" font-size="13" font-weight="600" text-anchor="start">92.1%</text>
  <text x="522" y="264" class="m" font-size="11" font-weight="400" text-anchor="start">interval 86.2% to 95.7%</text>
  <text x="24" y="310" class="t" font-size="12" font-weight="600" text-anchor="start">Share of all values sent to a person (lower is better; target 20% or less)</text>
  <line x1="150" y1="322" x2="150" y2="418" class="axis"/>
  <text x="150" y="434" class="m" font-size="11" font-weight="400" text-anchor="middle">0</text>
  <line x1="237.5" y1="322" x2="237.5" y2="418" class="grid"/>
  <text x="237.5" y="434" class="m" font-size="11" font-weight="400" text-anchor="middle">10</text>
  <line x1="325" y1="322" x2="325" y2="418" class="grid"/>
  <text x="325" y="434" class="m" font-size="11" font-weight="400" text-anchor="middle">20</text>
  <line x1="412.5" y1="322" x2="412.5" y2="418" class="grid"/>
  <text x="412.5" y="434" class="m" font-size="11" font-weight="400" text-anchor="middle">30</text>
  <line x1="500" y1="322" x2="500" y2="418" class="grid"/>
  <text x="500" y="434" class="m" font-size="11" font-weight="400" text-anchor="middle">40</text>
  <text x="138" y="346" class="t" font-size="12" font-weight="400" text-anchor="end">Muse Spark 1.3</text>
  <path d="M150 333H334.9A4 4 0 0 1 338.9 337V347A4 4 0 0 1 334.9 351H150Z" class="purple"/>
  <path d="M285.1 338V346M285.1 342H393.8M393.8 338V346" class="whisk"/>
  <text x="522" y="341" class="t" font-size="13" font-weight="600" text-anchor="start">21.6%</text>
  <text x="522" y="354" class="m" font-size="11" font-weight="400" text-anchor="start">interval 15.4% to 27.9%</text>
  <text x="138" y="376" class="t" font-size="12" font-weight="400" text-anchor="end">Muse Spark Open</text>
  <path d="M150 363H342.2A4 4 0 0 1 346.2 367V377A4 4 0 0 1 342.2 381H150Z" fill="url(#hatch-purple)" class="pstroke"/>
  <path d="M298.8 368V376M298.8 372H397.9M397.9 368V376" class="whisk"/>
  <text x="522" y="371" class="t" font-size="13" font-weight="600" text-anchor="start">22.4%</text>
  <text x="522" y="384" class="m" font-size="11" font-weight="400" text-anchor="start">interval 17.0% to 28.3%</text>
  <text x="138" y="406" class="t" font-size="12" font-weight="400" text-anchor="end">Mixed</text>
  <path d="M150 393H356.6A4 4 0 0 1 360.6 397V407A4 4 0 0 1 356.6 411H150Z" fill="url(#dots-purple)" class="pstroke"/>
  <path d="M311.3 398V406M311.3 402H411.6M411.6 398V406" class="whisk"/>
  <text x="522" y="401" class="t" font-size="13" font-weight="600" text-anchor="start">24.1%</text>
  <text x="522" y="414" class="m" font-size="11" font-weight="400" text-anchor="start">interval 18.4% to 29.9%</text>
  <text x="24" y="462" class="m" font-size="11" font-weight="400" text-anchor="start">Source: results/test_report.json, arms A, B and C. Wrong values caught = sent to review.</text>
  <text x="24" y="476" class="m" font-size="11" font-weight="400" text-anchor="start">Mixed did worse than either model alone on both: it caught the fewest wrong values and sent the most to a person.</text>
  <text x="24" y="490" class="m" font-size="11" font-weight="400" text-anchor="start">Arm B also extracted with Muse Spark Open, so it compares whole set-ups, not the second read alone.</text>
</svg>
