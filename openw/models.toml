# The roles of the P33 measurement (openw/): Muse Spark Open on Baseten and on Fireworks, asked
# exactly as the committed backends ask it, at every reasoning setting a probe may name.
#
# A role is "<host>.<effort>", with the committed backends' 60 s timeout, or "<host>.<effort>.long"
# with the 1200 s that version 1's extractor had (config/real_test.toml: a 570-cell table ran past
# 600). The backends are the committed ones behind a shim (openw/spy.py): it lets "none" and
# "minimal" through, which BasetenLLM and FireworksLLM refuse in their constructors, and it records
# every HTTP attempt. Prompts, schema, payload and repairs are the committed code's.
#
# Prices are config/models_open.toml's and config/models_fireworks.toml's (both $1.25 input and
# $4.25 output per 1M tokens; cached input billed as ordinary input; reasoning tokens as output).

# The five Treasury families of version 1 (config/real_test.toml), in its order.
[doc_types]
enabled = [
  "short_term_foreign_liabilities_as",
  "security_transactions_as_reported_by",
  "outstanding_forward_exchange_contracts",
  "receipts_and_expenditures_under_railroad",
  "total_claims_by_country",
]

[roles."baseten.none"]
kind = "llm"
backend = "openw_baseten"
model_id = "meta-models/muse-spark-open-1026"
settings = { reasoning_effort = "none" }

[roles."baseten.minimal"]
kind = "llm"
backend = "openw_baseten"
